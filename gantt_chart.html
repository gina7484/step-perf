
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Gantt Chart Visualization</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        #container {
            width: 100%;
            height: calc(100vh - 100px);
            overflow: auto;
            position: relative;
        }
        #timeline {
            position: relative;
            margin-top: 40px;
        }
        .file-row {
            height: 50px;
            margin-bottom: 5px;
            position: relative;
            border-bottom: 1px solid #eee;
        }
        .file-label {
            position: absolute;
            left: 0;
            top: 15px;
            width: 150px;
            font-weight: bold;
            text-align: right;
            padding-right: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .timeline-container {
            margin-left: 170px;
            position: relative;
            height: 100%;
        }
        .block {
            position: absolute;
            height: 30px;
            top: 10px;
            border-radius: 3px;
            text-align: center;
            font-size: 10px;
            overflow: hidden;
            white-space: nowrap;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .block:hover {
            opacity: 0.8;
        }
        .event-normal {
            background-color: #33A8FF; /* Blue for normal events */
        }
        .event-stop {
            background-color: #FF5733; /* Red-orange for stop events */
        }
        .timeline-marker {
            position: absolute;
            width: 1px;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.1);
            top: 0;
        }
        .timeline-label {
            position: absolute;
            font-size: 10px;
            color: #666;
            top: -20px;
            transform: translateX(-50%);
        }
        .controls {
            margin-bottom: 20px;
        }
        .tooltip {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 100;
            pointer-events: none;
            display: none;
        }
        button {
            margin-right: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
        #scale-slider {
            width: 200px;
            display: inline-block;
            vertical-align: middle;
        }
        .legend {
            margin-top: 10px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 20px;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h1>CSV Gantt Chart Visualization</h1>
    <div class="controls">
        <button id="zoom-in">Zoom In</button>
        <button id="zoom-out">Zoom Out</button>
        <button id="reset">Reset</button>
        <label for="scale-slider">Scale: </label>
        <input type="range" id="scale-slider" min="1" max="100" value="10">
        <span id="scale-value">1x</span>
    </div>
    <div class="legend">
        <div class="legend-item">
            <div class="legend-color event-normal"></div>
            <span>Normal Event</span>
        </div>
        <div class="legend-item">
            <div class="legend-color event-stop"></div>
            <span>Stop Event</span>
        </div>
    </div>
    <div id="container">
        <div id="timeline"></div>
    </div>
    <div id="tooltip" class="tooltip"></div>

    <script>
        // Data from Python
        const data = [{"file_id": "0", "prefix": "event", "identifier": "event_0_1", "start": 0.0, "end": 47.0, "is_stop": true}, {"file_id": "0", "prefix": "event", "identifier": "event_0_2", "start": 47.0, "end": 81.0, "is_stop": true}, {"file_id": "1", "prefix": "event", "identifier": "event_1_1", "start": 0.0, "end": 65.0, "is_stop": false}, {"file_id": "1", "prefix": "event", "identifier": "event_1_2", "start": 65.0, "end": 114.0, "is_stop": true}, {"file_id": "1", "prefix": "event", "identifier": "event_1_3", "start": 259.0, "end": 316.0, "is_stop": false}, {"file_id": "1", "prefix": "event", "identifier": "event_1_4", "start": 453.0, "end": 510.0, "is_stop": true}, {"file_id": "3", "prefix": "event", "identifier": "event_3_1", "start": 66.0, "end": 258.0, "is_stop": false}, {"file_id": "3", "prefix": "event", "identifier": "event_3_2", "start": 260.0, "end": 452.0, "is_stop": true}, {"file_id": "3", "prefix": "event", "identifier": "event_3_3", "start": 454.0, "end": 646.0, "is_stop": false}, {"file_id": "3", "prefix": "event", "identifier": "event_3_4", "start": 648.0, "end": 840.0, "is_stop": true}, {"file_id": "4", "prefix": "event", "identifier": "event_4_1", "start": 259.0, "end": 292.0, "is_stop": false}, {"file_id": "4", "prefix": "event", "identifier": "event_4_2", "start": 453.0, "end": 486.0, "is_stop": false}, {"file_id": "4", "prefix": "event", "identifier": "event_4_3", "start": 647.0, "end": 672.0, "is_stop": false}, {"file_id": "4", "prefix": "event", "identifier": "event_4_4", "start": 841.0, "end": 866.0, "is_stop": false}];
        const fileIds = ["0", "1", "3", "4"];
        const minTime = 0.0;
        const maxTime = 866.0;
        
        // Visualization variables
        let scale = 0.1;
        let timelineEl = document.getElementById('timeline');
        let containerEl = document.getElementById('container');
        let tooltipEl = document.getElementById('tooltip');
        let scaleSlider = document.getElementById('scale-slider');
        let scaleValue = document.getElementById('scale-value');
        
        // Function to render the timeline
        function renderTimeline() {
            timelineEl.innerHTML = '';
            const timelineWidth = (maxTime - minTime) * scale;
            
            // Create a row for each ID
            fileIds.forEach(fileId => {
                const fileRow = document.createElement('div');
                fileRow.className = 'file-row';
                
                const fileLabel = document.createElement('div');
                fileLabel.className = 'file-label';
                fileLabel.textContent = `ID: ${fileId}`;
                fileLabel.title = `ID: ${fileId}`; // Add tooltip for long IDs
                
                const timelineContainer = document.createElement('div');
                timelineContainer.className = 'timeline-container';
                timelineContainer.style.width = `${timelineWidth}px`;
                
                fileRow.appendChild(fileLabel);
                fileRow.appendChild(timelineContainer);
                timelineEl.appendChild(fileRow);
                
                // Add blocks for this ID
                const fileDataItems = data.filter(item => item.file_id === fileId);
                fileDataItems.forEach(item => {
                    const block = document.createElement('div');
                    
                    // Set color class based on is_stop flag
                    block.className = item.is_stop ? 'block event-stop' : 'block event-normal';
                    
                    // Position and size based on time values
                    const left = (item.start - minTime) * scale;
                    const width = (item.end - item.start) * scale;
                    
                    block.style.left = `${left}px`;
                    block.style.width = `${Math.max(width, 1)}px`;
                    
                    // Only show text if there's enough space
                    if (width > 40) {
                        block.textContent = item.identifier;
                    }
                    
                    // Add tooltip data
                    block.dataset.identifier = item.identifier;
                    block.dataset.start = item.start;
                    block.dataset.end = item.end;
                    block.dataset.isStop = item.is_stop;
                    
                    // Add event listeners for tooltip
                    block.addEventListener('mouseover', showTooltip);
                    block.addEventListener('mousemove', moveTooltip);
                    block.addEventListener('mouseout', hideTooltip);
                    
                    timelineContainer.appendChild(block);
                });
            });
            
            // Add time markers
            const stepSize = calculateStepSize(maxTime - minTime);
            for (let t = minTime; t <= maxTime; t += stepSize) {
                const marker = document.createElement('div');
                marker.className = 'timeline-marker';
                marker.style.left = `${(t - minTime) * scale + 170}px`;
                
                const label = document.createElement('div');
                label.className = 'timeline-label';
                label.textContent = t.toFixed(2) + 'ns';
                
                marker.appendChild(label);
                timelineEl.appendChild(marker);
            }
        }
        
        // Calculate appropriate step size for timeline markers
        function calculateStepSize(range) {
            const targetSteps = 10;
            const roughStep = range / targetSteps;
            
            // Round to a nice number
            const magnitude = Math.pow(10, Math.floor(Math.log10(roughStep)));
            const normalized = roughStep / magnitude;
            
            if (normalized < 1.5) return magnitude;
            if (normalized < 3.5) return 2 * magnitude;
            if (normalized < 7.5) return 5 * magnitude;
            return 10 * magnitude;
        }
        
        // Tooltip functions
        function showTooltip(e) {
            const block = e.target;
            tooltipEl.innerHTML = `
                Identifier: ${block.dataset.identifier}<br>
                Start: ${parseFloat(block.dataset.start).toFixed(2)} ns<br>
                End: ${parseFloat(block.dataset.end).toFixed(2)} ns<br>
                Duration: ${(parseFloat(block.dataset.end) - parseFloat(block.dataset.start)).toFixed(2)} ns<br>
                Type: ${block.dataset.isStop === 'true' ? 'Stop Event' : 'Normal Event'}
            `;
            tooltipEl.style.display = 'block';
            moveTooltip(e);
        }
        
        function moveTooltip(e) {
            tooltipEl.style.left = `${e.pageX + 10}px`;
            tooltipEl.style.top = `${e.pageY + 10}px`;
        }
        
        function hideTooltip() {
            tooltipEl.style.display = 'none';
        }
        
        // Initialize controls
        document.getElementById('zoom-in').addEventListener('click', () => {
            scale *= 1.5;
            updateScale();
            renderTimeline();
        });
        
        document.getElementById('zoom-out').addEventListener('click', () => {
            scale /= 1.5;
            updateScale();
            renderTimeline();
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            scale = 0.1;
            updateScale();
            renderTimeline();
            containerEl.scrollLeft = 0;
        });
        
        scaleSlider.addEventListener('input', () => {
            scale = scaleSlider.value / 100;
            updateScale();
            renderTimeline();
        });
        
        function updateScale() {
            scaleValue.textContent = `${scale.toFixed(2)}x`;
            scaleSlider.value = scale * 100;
        }
        
        // Initial render
        updateScale();
        renderTimeline();
    </script>
</body>
</html>
