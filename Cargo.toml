[package]
name = "hop"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dam = { git = "https://github.com/stanford-ppl/DAM-RS.git", branch = "dev", default-features=false, features = ["os-threads", "dot"]}
num = "0.4.0"
ndarray = "0.15.6"
crossbeam = "0.8.2"
derive_more = "0.99.17"
thiserror = "1.0.50"
frunk = "0.4.2"
num-traits = "0.2"
graphviz-rust = {version = "0.6.6", optional = true}
csv = "1.2"
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["dot"]
dot = ["dep:graphviz-rust"]
